# The two RC-car tasks: does memory, trained online, beat no memory at all --
# and how close does either get to a hand-written controller?
env: lanekeep
steps: 200000
seeds: 3
agents:
  - {name: "rtrrl/ctrnn", algo: rtrrl, cell: ctrnn}
  - {name: "rtrrl/ltc", algo: rtrrl, cell: ltc}
  - {name: "rtrrl/lrcu", algo: rtrrl, cell: lrcu}
  - {name: "rtrrl/ligru", algo: rtrrl, cell: ligru}
  - {name: "ac_lambda (memoryless)", algo: ac_lambda}
  - {name: "a2c_bptt (T=32)", algo: a2c_bptt, truncation: 32}
  - {name: "scripted", algo: scripted}
